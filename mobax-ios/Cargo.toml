[package]
name = "mobax-ios"
version.workspace = true
edition.workspace = true
description = "mobileAX for iPhone: WebDriverAgent, the accessibility inspector, screenshots and syslog over usbmuxd (experimental)"

[[bin]]
name = "mobax-ios"
path = "src/main.rs"

# Kept out of the mobax CLI, which is pure std: idevice brings tokio and rustls.
[dependencies]
idevice = { version = "=0.1.68", default-features = false, features = [
  "ring",
  "usbmuxd",
  "screenshotr",
  "syslog_relay",
  "dvt",
  "xctest",
  "wda",
  "installation_proxy",
  "mobile_image_mounter",
  "tss",
] }
tokio = { version = "1", features = ["rt", "macros", "time", "io-util", "io-std", "signal", "sync", "net"] }
serde_json = "1"
mobax-core = { path = "../mobax-core" }
base64 = "0.22"
plist = "1.8"
ns-keyed-archive = "0.1.5"
